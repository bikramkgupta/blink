name: Deploy to App Platform

on:
  push:
    branches: [app_platform]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy to App Platform
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_ISSUER_BASE_URL: ${{ secrets.OIDC_ISSUER_BASE_URL }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OAUTH2_JWT_AUDIENCE: ${{ secrets.OAUTH2_JWT_AUDIENCE }}
          OAUTH2_JWT_ISSUER: ${{ secrets.OAUTH2_JWT_ISSUER }}
          OAUTH2_JWT_SECRET: ${{ secrets.OAUTH2_JWT_SECRET }}
          OAUTH2_JWKS_URI: ${{ secrets.OAUTH2_JWKS_URI }}
          REACT_APP_BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          # Substitute environment variables in app.yaml
          envsubst < .do/app.yaml > .do/app-deploy.yaml

          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | grep "blink" | awk '{print $1}' || true)
          if [ -z "$APP_ID" ]; then
            echo "Creating new app..."
            doctl apps create --spec .do/app-deploy.yaml --wait
          else
            echo "Updating existing app: $APP_ID"
            doctl apps update "$APP_ID" --spec .do/app-deploy.yaml --wait
          fi